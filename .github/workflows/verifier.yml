name: verifier
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Étalons des instruments
        run: python mesures/eprouver_instruments.py
      - name: Porte de qualité
        run: python mesures/porte_qualite.py outils/*.py --racine .
      - name: Juge d'isolation
        run: python mesures/test_isolation.py outils --racine .

